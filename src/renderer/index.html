<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Document Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <rect x="6" y="3" width="24" height="32" rx="3" fill="currentColor" opacity=".18"></rect>
        <path d="M10 3h15l7 7v24a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" fill="none" stroke="currentColor" stroke-width="2.5"></path>
        <path d="M13 22l5 5 10-11" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span class="brand-name">Accessible Document Checker</span>
    </div>
    <nav aria-label="Main">
      <ul class="nav">
        <li><button type="button" class="nav-btn" data-view="dashboard" aria-current="page">Dashboard</button></li>
        <li><button type="button" class="nav-btn" data-view="settings">Settings</button></li>
        <li><button type="button" class="nav-btn" data-view="help">About the checks</button></li>
      </ul>
    </nav>
  </header>
  <div class="accent-stripe" aria-hidden="true"></div>

  <div class="layout">
    <aside class="sidebar" aria-labelledby="docs-heading">
      <h2 id="docs-heading">Documents</h2>
      <button type="button" id="add-btn" class="btn btn-primary btn-block">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
        Add documents
      </button>
      <div id="dropzone" class="dropzone">
        <p><strong>Or drag files here</strong></p>
        <p class="muted">Word (.docx), PowerPoint (.pptx) or PDF</p>
      </div>
      <p id="doc-count" class="muted small"></p>
      <ul id="doc-list" class="doc-list"></ul>
    </aside>

    <main id="main" tabindex="-1">
      <section id="view-dashboard" class="view" aria-labelledby="welcome-heading"></section>
      <section id="view-settings" class="view" aria-labelledby="settings-heading" hidden></section>
      <section id="view-help" class="view" aria-labelledby="help-heading" hidden></section>
    </main>
  </div>

  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="alert" class="sr-only" role="alert" aria-atomic="true"></div>
  <div id="toast" class="toast" aria-hidden="true" hidden></div>

  <script src="app.js"></script>
</body>
</html>
